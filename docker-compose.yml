services:
  postgres:
    image: postgres:16-alpine
    container_name: tasklz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tazkz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tazkz
    ports:
      - "5432:5432"
    volumes:
      - tasklz_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tazkz -d tazkz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tasklz_pgdata:
